$:
  vscode:
    - services:
        - vscode
        - docker
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /root/.bun/install/cache
          - /root/.npm
      imports:
        - https://cnb.cool/arsrna/env/-/blob/main/npm.yml
      runner:
        cpus: 16
      stages:
        - name: 配置wakatime
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/vscode.yml
          script:
            - echo "[settings]\n" > /root/.wakatime.cfg
            - echo "api_key = ${WAKA_APIKEY}"  >> /root/.wakatime.cfg
        - name: 安装插件
          script: code-server --install-extension yzhang.markdown-all-in-one
        - name: 安装依赖
          script: bun i

  push:
    同步到gay湖北:
      stages:
        - name: sync
          image: tencentcom/git-sync
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/git.yaml
          settings:
            target_url: https://github.com/ArSrNa/react-timeline.git
            auth_type: https
            username: ${GIT_USERNAME}
            password: ${GIT_ACCESS_TOKEN}
            git_email: "root@arsrna.cn"
            force: true
    单测:
      docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /root/.bun/install/cache
          - /root/.npm
      runner:
        cpus: 16
      stages:
        - name: 构建
          script:
            - bun i
            - bun run build
        - name: 测
          script: bun test --coverage
        - name: coverage
          type: testing:coverage
          options:
            diffLines: 78 # 增量覆盖率红线
          exports:
            lines: LINES
            diff_pct: DIFF_LINES
        - name: result
          script: echo echo "LINES $LINES DIFF_LINES $DIFF_LINES"

  # tag push 时触发
  tag_push:
    - docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
        volumes:
          - /root/.bun/install/cache
          - /root/.npm
      runner:
        cpus: 16
      stages:
        - name: 构建部署
          script:
            - bun i
            - bun run build
            - echo $CNB_BRANCH
        - name: npm publish
          imports:
            - https://cnb.cool/arsrna/env/-/blob/main/npm.yml
          script:
            - npm publish

        - name: cnb-npm publish
          image: tencentcom/npm
          settings:
            username: $CNB_TOKEN_USER_NAME
            token: $CNB_TOKEN
            email: $CNB_COMMITTER_EMAIL
            registry: https://npm.cnb.cool/arsrna/os-npm/-/packages/
            folder: ./
            fail_on_version_conflict: false

# 自动生成 Tag：仓库 Tag 列表页点击「自动生成 Tag」触发
# 不走默认模板（semantic-release 按提交信息推导版本），直接取 package.json 的 version 打 Tag
# 注意：auto_tag 必须挂在默认分支名下，写在 $ 下会被忽略
main:
  auto_tag:
    - docker:
        image: docker.cnb.cool/arsrna/dev-image/nodejs
      stages:
        - name: 按 package.json 版本打 Tag
          script: |
            set -e
            VERSION=$(node -p "require('./package.json').version")
            TAG="$VERSION" # 与历史 Tag 保持一致（3.0.2 这类，无 v 前缀），需要 v 前缀改成 "v$VERSION"
            echo "package.json version: $VERSION"

            git fetch --tags --force

            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG 已存在，跳过"
              exit 0
            fi

            git -c user.name="cnb-bot" -c user.email="cnb-bot@cnb.cool" tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
            echo "已推送 Tag $TAG"
